[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsearch"
version = "0.1.0"
description = "Agent-friendly Pinterest image search and downloader CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "SQLAlchemy>=2.0.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
clipsearch = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
